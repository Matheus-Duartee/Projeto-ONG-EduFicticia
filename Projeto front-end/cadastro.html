<!DOCTYPE html>
<html lang="pt_BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projetos - ONG EduFicticia</title>
    <link rel="stylesheet" href="css/estilos.css">
   
</head>
<body>
    <div class="wrapper">
            <aside class="menu">
                <!-- Checkbox invisivel responsavel pela logica de abrir e fechar o menu -->
                <input type="checkbox" id="menu-toggle">
                <label for="menu-toggle" class="menu-icon">☰</label>
                    <ul class="menu-list">
                        <li><a href="index.html">inicio</a></li>
                        <li><a href="projetos.html">Projetos</a></li>
                        <li><a href="cadastro.html">Cadastre-se</a></li>
                    </ul>
            </aside>

        <div class="main">
                <div class="header">
                    <h1>Cadastre-se</h1>
                </div>
            
                <div class="cadastro-container">
                        <form id="meu-formulario" novalidate>
                            <h2>Informações pessoais</h2>
                                <label for="nome">Nome Completo:</label>
                                <input type="text" id="nome" name="nome" required><br>

                                <label for="endereco">Endereço:</label>
                                <input type="text" id="endereco" name="endereco" required><br>
                                
                                <!-- Validação de CPF -->
                                <label for="cpf">CPF</label>
                                <input type="text" id="cpf" name="cpf" 
                                    placeholder="000.000.000-00"
                                    maxlength="14"
                                    pattern="[0-9]{3}\.[0-9]{3}\.[0-9]{3}-[0-9]{2}"
                                    title="Formato exigido: 000.000.000-00  (Com pontos e traço)"
                                    required><br>

                                <label for="data-nascimento">Data de Nascimento:</label>
                                <input type="date" id="data-nascimento" name="data_nascimento" required><br>

                                <label for="email">Email</label>
                                <input type="email" id="email" name="email" required>

                                <button type="submit">Enviar</button>
                        
                                <!-- Componente Toast de Notificação -->
                                <div class="toast-successo" id="toast-successo">
                                      <strong>Sucesso!</strong> Os dados do formulário foram validados corretamente.
                                </div>   
                                <div class="toast-falha" id="toast-falha">
                                      <strong>Erro.</strong> Preencha os campos corretamente!
                                </div>
                        </form>
                  </div>
                    <div class="footer">
                       <strong> © Todos os Direitos Reservados</strong>
                    </div>
                
        </div>
    </div>
</body>
            <script src="js/mascaras.js"></script>
</html>
